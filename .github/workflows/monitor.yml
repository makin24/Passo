name: Bilet Takip

on:
  schedule:
    - cron: "*/5 * * * *"    # her 5 dakikada bir (GitHub'ın izin verdiği en kısa aralık; bazen birkaç dk gecikmeli tetikleyebilir)
  workflow_dispatch: {}      # Actions sekmesinden elle de tetiklenebilir

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Kontrolü çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Durumu kaydet (bulunduysa tekrar bildirim gitmesin diye)
        run: |
          git config user.name "bilet-takip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state güncellendi"
          git push
